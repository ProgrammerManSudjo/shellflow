[Metadata]
Name=Cookie Clock
Description=Material You style scalloped clock built only from shapes (no image assets or plugins)
Version=1.3

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Size: Small (60%)
ContextAction=[!WriteKeyValue Variables Scale 0.6 "#CURRENTPATH##CURRENTFILE#"][!Refresh]
ContextTitle2=Size: Medium (80%)
ContextAction2=[!WriteKeyValue Variables Scale 0.8 "#CURRENTPATH##CURRENTFILE#"][!Refresh]
ContextTitle3=Size: Default (100%)
ContextAction3=[!WriteKeyValue Variables Scale 1 "#CURRENTPATH##CURRENTFILE#"][!Refresh]
ContextTitle4=Size: Large (125%)
ContextAction4=[!WriteKeyValue Variables Scale 1.25 "#CURRENTPATH##CURRENTFILE#"][!Refresh]
ContextTitle5=Size: Extra large (150%)
ContextAction5=[!WriteKeyValue Variables Scale 1.5 "#CURRENTPATH##CURRENTFILE#"][!Refresh]
ContextTitle6=Size: Huge (200%)
ContextAction6=[!WriteKeyValue Variables Scale 2 "#CURRENTPATH##CURRENTFILE#"][!Refresh]

[Variables]
; ---- layout (design size is 340x340, center at 170,170) ----
; Size multiplier: 1 = 340 px wide (0.8 is the default). Change it here or use the right-click menu.
Scale=1.25
CX=(170*#Scale#)
CY=(170*#Scale#)
; Colors are derived from the Windows accent color (see the accent measures below)
; ---- font (install "Outfit" from Google Fonts for the rounded look) ----
Font=Outfit

; ================= MEASURES =================
[mTime]
Measure=Time

[mDay]
Measure=Time
Format=%d

[mMonth]
Measure=Time
Format=%m

[mHourAng]
Measure=Calc
Formula=(mTime % 43200) / 43200 * 6.283185

[mMinAng]
Measure=Calc
Formula=(mTime % 3600) / 3600 * 6.283185

[mSecAng]
Measure=Calc
Formula=(mTime % 60) / 60 * 6.283185

[mHourX]
Measure=Calc
Formula=#CX# + 66 * #Scale# * Sin(mHourAng)

[mHourY]
Measure=Calc
Formula=#CY# - 66 * #Scale# * Cos(mHourAng)

[mMinX]
Measure=Calc
Formula=#CX# + 105 * #Scale# * Sin(mMinAng)

[mMinY]
Measure=Calc
Formula=#CY# - 105 * #Scale# * Cos(mMinAng)

[mSecX]
Measure=Calc
Formula=#CX# + 96 * #Scale# * Sin(mSecAng)

[mSecY]
Measure=Calc
Formula=#CY# - 96 * #Scale# * Cos(mSecAng)

; ---- Windows accent color ----
; DWM\AccentColor is stored as a DWORD in 0xAABBGGRR order
[mAcc]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\DWM
RegValue=AccentColor

[mAR]
Measure=Calc
Formula=mAcc - 256 * Floor(mAcc / 256)

[mAG]
Measure=Calc
Formula=Floor(mAcc / 256) - 256 * Floor(mAcc / 65536)

[mAB]
Measure=Calc
Formula=Floor(mAcc / 65536) - 256 * Floor(mAcc / 16777216)

; ---- Tones: Dk = dark body/text, Dt = dots, Md = hour hand/badge, Lt = minute hand/seconds/badge ----
[mDkR]
Measure=Calc
Formula=Floor(mAR*0.12)

[mDkG]
Measure=Calc
Formula=Floor(mAG*0.12)

[mDkB]
Measure=Calc
Formula=Floor(mAB*0.12)

[mDtR]
Measure=Calc
Formula=Floor(mAR+(255-mAR)*0.3)

[mDtG]
Measure=Calc
Formula=Floor(mAG+(255-mAG)*0.3)

[mDtB]
Measure=Calc
Formula=Floor(mAB+(255-mAB)*0.3)

[mMdR]
Measure=Calc
Formula=Floor(mAR+(255-mAR)*0.5)

[mMdG]
Measure=Calc
Formula=Floor(mAG+(255-mAG)*0.5)

[mMdB]
Measure=Calc
Formula=Floor(mAB+(255-mAB)*0.5)

[mLtR]
Measure=Calc
Formula=Floor(mAR+(255-mAR)*0.75)

[mLtG]
Measure=Calc
Formula=Floor(mAG+(255-mAG)*0.75)

[mLtB]
Measure=Calc
Formula=Floor(mAB+(255-mAB)*0.75)

; ================= METERS =================
; Static face: scalloped body, 12 dots, two badges
[MeterFace]
Meter=Shape
