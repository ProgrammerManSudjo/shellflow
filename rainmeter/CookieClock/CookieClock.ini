Shape15=Ellipse (#Scale#*281.00),(#Scale#*281.00),(#Scale#*43.00) | Fill Color [mMdR],[mMdG],[mMdB] | StrokeWidth 0

; Hands, center pin and seconds dot
[MeterHands]
Meter=Shape
X=0
Y=0
DynamicVariables=1
Shape=Line #CX#,#CY#,[mHourX],[mHourY] | StrokeWidth (26*#Scale#) | Stroke Color [mMdR],[mMdG],[mMdB] | StrokeStartCap Round | StrokeEndCap Round
Shape2=Line #CX#,#CY#,[mMinX],[mMinY] | StrokeWidth (20*#Scale#) | Stroke Color [mLtR],[mLtG],[mLtB] | StrokeStartCap Round | StrokeEndCap Round
Shape3=Ellipse [mSecX],[mSecY],(13*#Scale#) | Fill Color [mLtR],[mLtG],[mLtB] | StrokeWidth 0
Shape4=Ellipse #CX#,#CY#,(10*#Scale#) | Fill Color [mLtR],[mLtG],[mLtB] | StrokeWidth 0
Shape5=Ellipse #CX#,#CY#,(4*#Scale#) | Fill Color [mDkR],[mDkG],[mDkB] | StrokeWidth 0

; Badge text: day of month (top-left), month number (bottom-right)
[MeterDay]
Meter=String
MeasureName=mDay
X=(#CX#-111*#Scale#)
Y=(#CY#-111*#Scale#)
StringAlign=CenterCenter
FontFace=#Font#
FontSize=(24*#Scale#)
StringStyle=Bold
FontColor=[mDkR],[mDkG],[mDkB]
AntiAlias=1
DynamicVariables=1

[MeterMonth]
Meter=String
MeasureName=mMonth
X=(#CX#+111*#Scale#)
Y=(#CY#+111*#Scale#)
StringAlign=CenterCenter
FontFace=#Font#
FontSize=(24*#Scale#)
StringStyle=Bold
FontColor=[mDkR],[mDkG],[mDkB]
AntiAlias=1
DynamicVariables=1
